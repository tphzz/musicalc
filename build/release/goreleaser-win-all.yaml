version: 2
project_name: musicalc
dist: build/dist

snapshot:
  version_template: '{{ if index .Env "MUSICALC_SNAPSHOT_VERSION" }}{{ index .Env "MUSICALC_SNAPSHOT_VERSION" }}{{ else }}{{ .Version }}-snapshot.g{{ .ShortCommit }}{{ end }}'

builds:
  - id: win-amd64
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target x86_64-windows-gnu
      - CXX=zig c++ -target x86_64-windows-gnu
      - CGO_CFLAGS=-O3 -mcpu=x86_64_v3
      - CGO_LDFLAGS=-O3
    flags: [-trimpath]
    goos: [windows]
    goarch: [amd64]
    goamd64: [v3]
    # Zig requires the GUI subsystem explicitly at the external link step.
    ldflags:
      - -s -w -H=windowsgui -extldflags=-Wl,--subsystem,windows -X main.version={{ .Version }}
    binary: musicalc_x64
    # This keeps the binary at the top level of the dist folder
    no_unique_dist_dir: true

  - id: win-arm64
    env:
      - CGO_ENABLED=1
      - CC=zig cc -target aarch64-windows-gnu
      - CXX=zig c++ -target aarch64-windows-gnu
      - CGO_CFLAGS=-O3 -mcpu=oryon_1 -fomit-frame-pointer
      - CGO_LDFLAGS=-O3
    flags: [-trimpath]
    goos: [windows]
    goarch: [arm64]
    ldflags:
      - -s -w -H=windowsgui -extldflags=-Wl,--subsystem,windows -X main.version={{ .Version }}
    binary: musicalc_arm64
    no_unique_dist_dir: true

