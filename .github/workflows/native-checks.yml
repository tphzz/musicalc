name: 90 Helper - Checks
on:
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.checks.outputs.version }}
      release:
        value: ${{ jobs.checks.outputs.release }}
      commit:
        value: ${{ jobs.checks.outputs.commit }}
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  checks:
    runs-on: [self-hosted, Linux, X64, jammy, docker]
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.2"
      - name: Resolve selected ref
        id: version
        run: python build/scripts/version.py --github
      - name: Check release helpers and Go source
        run: |
          python -m unittest discover -s build/scripts -p 'test_*.py' -v
          go vet ./...
