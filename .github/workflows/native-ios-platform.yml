name: 94 Helper - iPhone
on:
  workflow_call:
    inputs:
      upload_testflight:
        type: boolean
        default: false
permissions:
  contents: read
env:
  GOTOOLCHAIN: local
  PYTHONDONTWRITEBYTECODE: "1"
jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    concurrency:
      group: native-apple-silicon-host
      cancel-in-progress: false
      queue: max
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.2"
      - name: Test iPhone workflow invocation
        shell: bash
        run: python3 -m unittest discover -s build/scripts -p test_ios_workflow.py -v
      - name: Unlock runner signing keychain and package iPhone
        shell: bash
        run: |
          set -euo pipefail
          source build/scripts/apple-signing.sh
          unlock_signing_keychain
          if [[ "$UPLOAD_TESTFLIGHT" == true ]]; then
            python3 build/scripts/build-ios.py --upload
          else
            python3 build/scripts/build-ios.py
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iphone-testflight
          path: build/dist/ios/*
          overwrite: true
          if-no-files-found: error
