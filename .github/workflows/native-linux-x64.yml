name: 13 Build - Linux x64
run-name: "${{ github.workflow }} | ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  checks:
    uses: ./.github/workflows/native-checks.yml
  build:
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: linux
      arch: amd64
      runner_labels: '["self-hosted","Linux","X64","jammy","docker"]'
      host_group: native-x64-host
