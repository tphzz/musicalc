name: 14 Build - Linux ARM64
run-name: "${{ github.workflow }} | ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-arm64-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  checks:
    uses: ./.github/workflows/native-checks.yml
  build:
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: linux
      arch: arm64
      runner_labels: '["self-hosted","Linux","ARM64","jammy","docker"]'
      host_group: native-apple-silicon-host
