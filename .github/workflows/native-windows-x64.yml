name: 10 Build - Windows x64
run-name: "${{ github.workflow }} | ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  checks:
    uses: ./.github/workflows/native-checks.yml
  build:
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: windows
      arch: amd64
      runner_labels: '["self-hosted","Windows","X64"]'
      host_group: native-x64-host
