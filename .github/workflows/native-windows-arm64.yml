name: 11 Build - Windows ARM64
run-name: "${{ github.workflow }} | ${{ github.ref_name }}"
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  checks:
    uses: ./.github/workflows/native-checks.yml
  build:
    needs: checks
    uses: ./.github/workflows/native-platform.yml
    with:
      platform: windows
      arch: arm64
      runner_labels: '["self-hosted","Windows","ARM64"]'
      host_group: native-apple-silicon-host
